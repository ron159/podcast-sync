services:
  state-sync:
    build: .
    image: podcast-sync-server:0.1.0
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      RUST_LOG: "${RUST_LOG:-info}"
      STATE_SYNC_DATABASE_PATH: /data/sync.db
      STATE_SYNC_LISTEN_ADDR: 0.0.0.0:8080
      STATE_SYNC_RATE_LIMIT_PER_MINUTE: "${STATE_SYNC_RATE_LIMIT_PER_MINUTE:-120}"
      STATE_SYNC_TOKEN_FILE: /run/secrets/state_sync_token
    ports:
      - "${STATE_SYNC_BIND_ADDRESS:-127.0.0.1}:${STATE_SYNC_PORT:-8080}:8080"
    volumes:
      - ./data:/data
      - ./backups:/backups
    secrets:
      - state_sync_token
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  state_sync_token:
    file: ./secrets/sync_token
